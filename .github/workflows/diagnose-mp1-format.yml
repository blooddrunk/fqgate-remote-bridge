name: Temporary MP-1 Markdown Formatter Diff

on:
  push:
    branches: [main]

jobs:
  show-format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print canonical Prettier diff without writing back to repository
        run: |
          pnpm exec prettier --write docs/tasks/fqgate-2-0-5-mp1-offline-resolver-prototype.md
          git --no-pager diff -- docs/tasks/fqgate-2-0-5-mp1-offline-resolver-prototype.md
