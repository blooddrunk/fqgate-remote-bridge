name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.23.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser E2E tests
        if: runner.os == 'Linux'
        run: pnpm test:e2e

      - name: Format check
        run: pnpm format:check

      - name: Windows script CLI smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          pwsh -NoProfile -NonInteractive -File "$env:GITHUB_WORKSPACE\scripts\windows\bootstrap.ps1" -VerifyCli
          pwsh -NoProfile -NonInteractive -File "$env:GITHUB_WORKSPACE\scripts\windows\acceptance.ps1" -VerifyCli

      - name: Windows production loopback smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -File "$env:GITHUB_WORKSPACE\scripts\windows\acceptance.ps1" -VerifyBridge

      - name: Windows acceptance vault tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -File "$env:GITHUB_WORKSPACE\scripts\windows\test-acceptance-credential-vault.ps1"
          pwsh -NoProfile -NonInteractive -File "$env:GITHUB_WORKSPACE\scripts\windows\smoke-acceptance-credential-vault.ps1"
