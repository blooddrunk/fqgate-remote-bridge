name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only reads code and never needs a repository write token.
permissions:
  contents: read

# Cancel obsolete PR work, but use a unique group per main push to preserve every run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.23.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: runner.os == 'Linux'
        run: pnpm typecheck

      - name: Lint
        if: runner.os == 'Linux'
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Offline profile boundary audit
        if: runner.os == 'Linux'
        run: node scripts/audit-profile-prototype.mjs

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Browser E2E tests
        if: runner.os == 'Linux'
        run: pnpm test:e2e

      - name: Format check
        if: runner.os == 'Linux'
        run: pnpm format:check

      - name: Windows script CLI smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          pwsh -NoProfile -NonInteractive -File "$env:GITHUB_WORKSPACE\scripts\windows\bootstrap.ps1" -VerifyCli
          pwsh -NoProfile -NonInteractive -File "$env:GITHUB_WORKSPACE\scripts\windows\acceptance.ps1" -VerifyCli

      - name: Windows production loopback smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -File "$env:GITHUB_WORKSPACE\scripts\windows\acceptance.ps1" -VerifyBridge

      - name: Windows acceptance vault tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -File "$env:GITHUB_WORKSPACE\scripts\windows\test-acceptance-credential-vault.ps1"
          pwsh -NoProfile -NonInteractive -File "$env:GITHUB_WORKSPACE\scripts\windows\smoke-acceptance-credential-vault.ps1"

      - name: Windows v2 observation boundary smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$env:GITHUB_WORKSPACE\scripts\windows\fqgate-v2-observation.ps1", [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) { throw 'v2 observation PowerShell parse failed' }
          foreach ($command in @('inspect-v2', 'audit-v2')) {
            node "$env:GITHUB_WORKSPACE\dist\cli\main.js" fqgate $command --apply --json
            if ($LASTEXITCODE -ne 2) { throw 'v2 observation accepted a mutation flag' }
          }
          pwsh -NoProfile -NonInteractive -File "$env:GITHUB_WORKSPACE\scripts\windows\test-fqgate-v2-observation.ps1"
          if ($LASTEXITCODE -ne 0) { throw 'v2 observation behavior fixtures failed' }
          pwsh -NoProfile -NonInteractive -File "$env:GITHUB_WORKSPACE\scripts\windows\test-fqgate205-qr-preflight.ps1"
          if ($LASTEXITCODE -ne 0) { throw 'QR preflight behavior fixtures failed' }
          node "$env:GITHUB_WORKSPACE\scripts\windows\test-fqgate205-qr-identity.mjs"
          if ($LASTEXITCODE -ne 0) { throw 'Inline QR identity behavior fixtures failed' }
          pwsh -NoProfile -NonInteractive -File "$env:GITHUB_WORKSPACE\scripts\windows\test-fqgate205-mp2-native.ps1"
          if ($LASTEXITCODE -ne 0) { throw 'MP2 native collection fixtures failed' }
          pwsh -NoProfile -NonInteractive -File "$env:GITHUB_WORKSPACE\scripts\windows\test-fqgate205-mp3-native.ps1"
          if ($LASTEXITCODE -ne 0) { throw 'MP3 native collection fixtures failed' }
          pwsh -NoProfile -NonInteractive -File "$env:GITHUB_WORKSPACE\scripts\windows\test-fqgate205-mp4-cli.ps1"
          if ($LASTEXITCODE -ne 0) { throw 'MP4 GET-only CLI boundary fixtures failed' }
          pwsh -NoProfile -NonInteractive -File "$env:GITHUB_WORKSPACE\scripts\windows\test-fqgate205-mp6-host.ps1"
          if ($LASTEXITCODE -ne 0) { throw 'MP6 host metadata fixtures failed' }
          node "$env:GITHUB_WORKSPACE\scripts\windows\test-fqgate-mp8.mjs"
          if ($LASTEXITCODE -ne 0) { throw 'MP8 inert compiled fixtures failed' }
          exit 0
